# Cloudflare Pages project config for hub.ollyhenson.com
#
# You can deploy either way:
#   A) Dashboard (Git-connected or "Direct Upload") — set the KV binding in
#      the Pages project UI and this file's [[kv_namespaces]] block is just
#      documentation.
#   B) CLI:  npx wrangler pages deploy public --project-name hub-ollyhenson
#      In that case fill in the `id` below and it wires the binding for you.

name = "hub-ollyhenson"
pages_build_output_dir = "public"
compatibility_date = "2026-09-01"

# The Functions in ./functions need this KV namespace bound as HUB_KV.
# Create it with:  npx wrangler kv namespace create hub-state
# then paste the returned id here (and the preview_id if you want `wrangler pages dev`).
[[kv_namespaces]]
binding = "HUB_KV"
id = "f6ae5047d04c492d9409f74cdb3bb920"
# preview_id = "PASTE_PREVIEW_KV_ID_HERE"
