<!-- ============================================================
     Heart Attractor / The Attraction Formula — Skool COVER IMAGE builder
     Built 2026-09-04.  Layout v4 — "photo + solid bottom bar".

     Tuned for standing out as a MOBILE Facebook / Skool Discovery
     thumbnail (research-backed):
       - 1.7s scroll-stop: ONE message, ONE focal point
       - contrast-first: text sits on a SOLID dark bar, not a gradient wash
       - text in a bottom banner over empty space, never on the subject
       - keep text well under 20% of the image; brand name is NOT on the image
       - the photo's emotion (the laugh / embrace) does the stopping

     Text (all of it):
        manifest  LOVE  [ no doubts ]        <- one line, the hook

     Open in Chrome:
       1. Choose photo.
       2. Frame: Horizontal / Shift / Vertical / Zoom (+ Black & white).
       3. Bar height / Bar darkness for the bottom band.
       4. Headline / CTA size; drag the text to nudge it.
       5. Download PNG (1920x1020 = Skool's 1084x576 ratio) and upload.
     ============================================================ -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,600;0,700;0,800;0,900&display=swap" rel="stylesheet">
<style>
  :root{ --mag:#d946ef; }
  html,body{ margin:0; padding:0; background:#150818; color:#f8f4ff;
    font-family:'Poppins',system-ui,sans-serif; }
  .wrap{ max-width:1000px; margin:0 auto; padding:28px 20px 60px; }
  h1.page{ font-size:19px; font-weight:700; letter-spacing:.02em; margin:0 0 4px; }
  p.page{ font-size:13px; color:#c4b5fd; margin:0 0 22px; }

  .frame{ background:#0A0510; border:1px solid #3a2350; border-radius:12px;
    overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.5); }
  #view{ display:block; width:100%; height:auto; touch-action:none; }

  .controls{ display:grid; grid-template-columns:1fr 1fr; gap:16px 26px; margin-top:22px; }
  .ctl{ display:flex; flex-direction:column; gap:7px; }
  .ctl label{ font-size:12px; font-weight:600; letter-spacing:.04em;
    text-transform:uppercase; color:#c4b5fd; display:flex; justify-content:space-between; }
  .ctl label span{ color:#7f7390; font-weight:500; }
  .ctl input[type=range]{ width:100%; accent-color:var(--mag); }
  .chk{ grid-column:1 / -1; display:flex; align-items:center; gap:10px; font-size:13px; color:#c9bdd6; }
  .grouphd{ grid-column:1 / -1; font-size:11px; font-weight:700; letter-spacing:.14em;
    text-transform:uppercase; color:#6f6480; margin-top:10px; border-top:1px solid #241d2e; padding-top:14px; }
  .row{ grid-column:1 / -1; display:flex; gap:14px; align-items:center; flex-wrap:wrap; margin-top:4px; }
  button, .filebtn{ font:inherit; font-weight:700; font-size:14px; border:0; border-radius:9px; padding:12px 22px; cursor:pointer; }
  .filebtn, #reset{ background:#2a1b3d; color:#f8f4ff; }
  #dl{ background:linear-gradient(180deg,#E1A6FF,#d946ef); color:#fff; box-shadow:0 12px 34px rgba(217,70,239,.4); }
  #dl:disabled{ opacity:.4; cursor:not-allowed; box-shadow:none; }
  input[type=file]{ display:none; }
  .hint{ font-size:12px; color:#9a86c4; }
</style>

<div class="wrap">
  <h1 class="page">Skool cover builder — photo + bottom bar</h1>
  <p class="page">One line of hook on a solid bar. Drag the text to nudge it.</p>

  <div class="frame">
    <canvas id="view" width="1920" height="1020"></canvas>
  </div>

  <div class="controls">
    <div class="row">
      <label class="filebtn" for="file">Choose a different photo</label>
      <input id="file" type="file" accept="image/*">
      <span id="fname" class="hint">wall_003 (built in)</span>
    </div>

    <div class="grouphd">Photo</div>
    <div class="ctl">
      <label>Horizontal position <span id="posx-v">50</span></label>
      <input id="posx" type="range" min="0" max="100" value="50">
    </div>
    <div class="ctl">
      <label>Shift left / right (px) <span id="shx-v">0</span></label>
      <input id="shx" type="range" min="-800" max="800" value="0">
    </div>
    <div class="ctl">
      <label>Vertical position <span id="posy-v">30</span></label>
      <input id="posy" type="range" min="0" max="100" value="30">
    </div>
    <div class="ctl">
      <label>Zoom <span id="zoom-v">108</span></label>
      <input id="zoom" type="range" min="100" max="220" value="108">
    </div>
    <div class="chk">
      <input type="checkbox" id="bw"><label for="bw" style="text-transform:none;letter-spacing:0;color:#c9bdd6;font-weight:500">Black &amp; white</label>
    </div>

    <div class="grouphd">Bottom bar</div>
    <div class="ctl">
      <label>Bar height <span id="barh-v">28</span></label>
      <input id="barh" type="range" min="16" max="55" value="28">
    </div>
    <div class="ctl">
      <label>Bar darkness <span id="bard-v">92</span></label>
      <input id="bard" type="range" min="35" max="100" value="92">
    </div>

    <div class="grouphd">Text</div>
    <div class="ctl">
      <label>Headline size <span id="hl-v">100%</span></label>
      <input id="hl" type="range" min="50" max="140" value="100">
    </div>

    <div class="row">
      <button id="dl" disabled>Download PNG</button>
      <button id="reset" type="button">Reset text position</button>
      <span class="hint">1920 &times; 1020 &nbsp;·&nbsp; drag the text on the preview</span>
    </div>
  </div>
</div>

<script>
(function(){
  var cv = document.getElementById('view');
  var ctx = cv.getContext('2d');
  var W = 1920, H = 1020;
  var img = null;
  var ids = ['posx','shx','posy','zoom','barh','bard','hl'];
  var els = { file:document.getElementById('file'), fname:document.getElementById('fname'),
              dl:document.getElementById('dl'), reset:document.getElementById('reset'),
              bw:document.getElementById('bw') };
  ids.forEach(function(k){ els[k]=document.getElementById(k); els[k+'v']=document.getElementById(k+'-v'); });

  var off = { x:0, y:0 };
  var hitBox = null;

  var TXT = { a:'manifest', b:'LOVE', c:'no doubts' };

  function drawPhoto(){
    if(!img) return;
    var scale = Math.max(W/img.width, H/img.height) * (+els.zoom.value/100);
    var dw = img.width*scale, dh = img.height*scale;
    var dx = (W-dw)*(+els.posx.value/100) + (+els.shx.value);
    var dy = (H-dh)*(+els.posy.value/100);
    ctx.save();
    ctx.filter = els.bw.checked
      ? 'grayscale(1) contrast(1.03) brightness(1.0)'
      : 'saturate(1.05) contrast(1.02)';
    ctx.drawImage(img, dx, dy, dw, dh);
    ctx.restore();
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function render(){
    ids.forEach(function(k){
      els[k+'v'].textContent = els[k].value + (k==='hl' ? '%' : '');
    });

    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = '#0A0510';
    ctx.fillRect(0,0,W,H);
    drawPhoto();

    // ---- solid bottom bar ----
    var barFrac = +els.barh.value/100;
    var d = +els.bard.value/100;
    var barTop = H * (1 - barFrac);
    var g = ctx.createLinearGradient(0, barTop, 0, H);
    g.addColorStop(0,    'rgba(10,5,16,0)');
    g.addColorStop(0.30, 'rgba(10,5,16,' + (0.45*d).toFixed(3) + ')');
    g.addColorStop(0.62, 'rgba(10,5,16,' + (0.88*d).toFixed(3) + ')');
    g.addColorStop(1,    'rgba(10,5,16,' + Math.min(1, 1.0*d).toFixed(3) + ')');
    ctx.fillStyle = g;
    ctx.fillRect(0, barTop, W, H - barTop);

    // ---- text ----
    var barH = H - barTop;
    var hz  = 104 * (+els.hl.value/100);

    var cx = W/2 + off.x;
    // The "no doubts" box is the tallest element and defines the visual
    // block; its vertical centre is (baseline - 0.34*hz). Put THAT on the
    // exact middle of the bar rectangle so there's equal air above and
    // below, regardless of bar height or headline size.
    var barMid = (barTop + H) / 2;
    var baseY = barMid + hz * 0.34 + off.y;

    // measure the three parts
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';

    ctx.font = '800 ' + hz + 'px Poppins, sans-serif';
    ctx.letterSpacing = '0px';
    var wA = ctx.measureText(TXT.a).width;

    var lsB = hz*0.015;
    ctx.font = '900 ' + (hz*1.05) + 'px Poppins, sans-serif';
    ctx.letterSpacing = lsB + 'px';
    var wB = ctx.measureText(TXT.b).width + lsB;

    var boxTextSize = hz*0.72;
    ctx.font = '800 ' + boxTextSize + 'px Poppins, sans-serif';
    ctx.letterSpacing = '0px';
    var wCtext = ctx.measureText(TXT.c).width;
    var boxPadX = hz*0.32, boxPadY = hz*0.19;
    var boxH = boxTextSize + boxPadY*2;
    var wC = wCtext + boxPadX*2;

    var gapAB = hz*0.30, gapBC = hz*0.32;
    var totalW = wA + gapAB + wB + gapBC + wC;
    var x = cx - totalW/2;

    // A — manifest (magenta)
    ctx.save();
    ctx.font = '800 ' + hz + 'px Poppins, sans-serif';
    ctx.letterSpacing = '0px';
    ctx.shadowColor='rgba(0,0,0,0.35)'; ctx.shadowBlur=16; ctx.shadowOffsetY=3;
    ctx.fillStyle = '#E1A6FF';
    ctx.fillText(TXT.a, x, baseY);
    ctx.restore();
    x += wA + gapAB;

    // B — LOVE (white caps)
    ctx.save();
    ctx.font = '900 ' + (hz*1.05) + 'px Poppins, sans-serif';
    ctx.letterSpacing = lsB + 'px';
    ctx.shadowColor='rgba(0,0,0,0.4)'; ctx.shadowBlur=16; ctx.shadowOffsetY=3;
    ctx.fillStyle = '#f8f4ff';
    ctx.fillText(TXT.b, x, baseY);
    ctx.restore();
    x += wB + gapBC;

    // C — [ no doubts ] box
    var capMid = baseY - hz*0.34;
    var boxY = capMid - boxH/2;
    ctx.save();
    ctx.shadowColor='rgba(217,70,239,0.5)'; ctx.shadowBlur=30; ctx.shadowOffsetY=8;
    ctx.fillStyle = '#d946ef';
    roundRect(x, boxY, wC, boxH, boxH*0.24);
    ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.font = '800 ' + boxTextSize + 'px Poppins, sans-serif';
    ctx.letterSpacing = '0px';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ffffff';
    ctx.fillText(TXT.c, x + boxPadX, capMid + boxTextSize*0.02);
    ctx.restore();

    hitBox = {
      x: cx - totalW/2 - 40,
      y: baseY - hz*1.15,
      w: totalW + 80,
      h: hz*1.4
    };
  }

  // ---- drag ----
  var drag = null;
  function toCanvas(e){
    var r = cv.getBoundingClientRect();
    return { x:(e.clientX-r.left)*(W/r.width), y:(e.clientY-r.top)*(H/r.height) };
  }
  function inBox(p){
    return hitBox && p.x>=hitBox.x && p.x<=hitBox.x+hitBox.w
                  && p.y>=hitBox.y && p.y<=hitBox.y+hitBox.h;
  }
  cv.addEventListener('pointermove', function(e){
    if(drag){
      var p = toCanvas(e);
      off.x = drag.bx + (p.x - drag.sx);
      off.y = drag.by + (p.y - drag.sy);
      render();
    } else {
      cv.style.cursor = inBox(toCanvas(e)) ? 'grab' : 'default';
    }
  });
  cv.addEventListener('pointerdown', function(e){
    var p = toCanvas(e);
    if(!inBox(p)) return;
    drag = { sx:p.x, sy:p.y, bx:off.x, by:off.y };
    cv.setPointerCapture(e.pointerId);
    cv.style.cursor = 'grabbing';
  });
  function endDrag(){ drag = null; cv.style.cursor = 'default'; }
  cv.addEventListener('pointerup', endDrag);
  cv.addEventListener('pointercancel', endDrag);

  els.reset.addEventListener('click', function(){ off = {x:0,y:0}; render(); });
  els.bw.addEventListener('change', render);
  ids.forEach(function(k){ els[k].addEventListener('input', render); });

  els.file.addEventListener('change', function(e){
    var f = e.target.files && e.target.files[0];
    if(!f) return;
    els.fname.textContent = f.name;
    var url = URL.createObjectURL(f);
    var im = new Image();
    im.onload = function(){ img = im; els.dl.disabled = false; render(); URL.revokeObjectURL(url); };
    im.src = url;
  });

  els.dl.addEventListener('click', function(){
    cv.toBlob(function(blob){
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'skool-cover.png';
      a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
    }, 'image/png');
  });

  // built-in photo (embedded so the file is self-contained; data: URIs
  // don't taint the canvas, so Download PNG still works)
  if (typeof EMBEDDED_PHOTO === 'string' && EMBEDDED_PHOTO) {
    var im0 = new Image();
    im0.onload = function(){ img = im0; els.dl.disabled = false; render(); };
    im0.src = EMBEDDED_PHOTO;
  }

  if(document.fonts && document.fonts.load){
    Promise.all([
      document.fonts.load('900 104px Poppins'),
      document.fonts.load('800 104px Poppins'),
      document.fonts.load('700 30px Poppins')
    ]).then(render, render);
  }
  render();
})();
</script>
