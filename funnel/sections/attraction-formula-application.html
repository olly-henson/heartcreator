  .ohc-divider {
    border: none; border-top: 1px solid rgba(109,40,217,0.15);

  /* ── SUBMIT BUTTON ── */
  .ohc-btn {
    width: 100%; padding: 22px;
    background: linear-gradient(135deg, #7c3aed, #6d28d9, #4c1d95);
    border: none; border-radius: 16px;
    font-family: 'Inter', sans-serif;
    font-size: 19px; font-weight: 700; color: white;
    cursor: pointer; letter-spacing: 0.5px;
    position: relative; overflow: hidden;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 6px 32px rgba(109,40,217,0.6), 0 0 0 1px rgba(167,139,250,0.2) inset;
    margin-top: 12px;
  }
  .ohc-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 48px rgba(109,40,217,0.8), 0 0 0 1px rgba(196,181,253,0.25) inset;
  }
  .ohc-btn:active { transform: translateY(0); }
  .ohc-btn::after {
    content: ''; position: absolute;
    top: 0; left: -100%; width: 60%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
    transition: left 0.5s ease;
  }
  .ohc-btn:hover::after { left: 150%; }
  .ohc-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  /* ── SUCCESS / ERROR ── */
  .ohc-error-msg {
    display: none; background: rgba(239,68,68,0.1);

</style>

<script>
  document.getElementById('ohcSubmitBtn').addEventListener('click', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('ohcSubmitBtn');
    const errorEl = document.getElementById('ohcError');
    btn.disabled = true;
    btn.textContent = 'Sending…';
    errorEl.style.display = 'none';

    const utmParams = getUtmParams();

    const data = {
      first_name:   document.getElementById('ohc_fname').value.trim(),
      last_name:    document.getElementById('ohc_lname').value.trim(),
      email:        document.getElementById('ohc_email').value.trim(),
      whatsapp:     document.getElementById('whatsapp_code').value.replace('-CA','') + ' ' + document.getElementById('whatsapp').value.trim(),
      profession:   document.getElementById('profession').value.trim(),
      situation:        document.getElementById('situation').value.trim(),
      goal_12wk:        document.getElementById('goal_12wk').value.trim(),
      goal_12mo:        document.getElementById('goal_12mo').value.trim(),
      tried:            document.getElementById('tried').value.trim(),
      stuck:            document.getElementById('stuck').value.trim(),
      coached_before:   (document.querySelector('input[name="coached_before"]:checked') || {}).value || '',
      questions_for_me: document.getElementById('questions_for_me').value.trim(),
      utm_source:   utmParams.utm_source,
      utm_medium:   utmParams.utm_medium,
      utm_campaign: utmParams.utm_campaign,
      utm_content:  utmParams.utm_content,
      upgrade_path: new URLSearchParams(window.location.search).get('ref') || ''
    };

    try {
      // ⚠️ Create a new "Applications" workflow in GHL with an Inbound Webhook trigger,
      // then paste its URL here (replaces the placeholder below).
      await fetch('PASTE_YOUR_GHL_WEBHOOK_URL_HERE', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      window.location.href = 'https://ollyhenson.com/attraction-formula-thank-you';
    } catch(err) {
      btn.disabled = false;
      btn.textContent = 'Submit My Application →';
      errorEl.style.display = 'block';
    }
  });

  function getUtmParams() {
    var params = new URLSearchParams(window.location.search);
    var stored = {};
    try { stored = JSON.parse(sessionStorage.getItem('ohc_utm') || '{}'); } catch(e) {}
    var utm = {
      utm_source:   params.get('utm_source')   || stored.utm_source   || '',
      utm_medium:   params.get('utm_medium')   || stored.utm_medium   || '',
      utm_campaign: params.get('utm_campaign') || stored.utm_campaign || '',
      utm_content:  params.get('utm_content')  || stored.utm_content  || ''
    };
    try { sessionStorage.setItem('ohc_utm', JSON.stringify(utm)); } catch(e) {}
    return utm;
  }

  getUtmParams();
</script>
