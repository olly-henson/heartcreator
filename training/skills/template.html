<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRAINING NAME — Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#6B1E4D;
    --navy-deep:#3D0F2C;
    --ink:#2A1420;
    --orange:#E8672C;
    --cream:#FBF3F0;
    --paper:#FFFFFF;
    --line:#E9DCE3;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Poppins', sans-serif;
    color:var(--ink);
    background:var(--paper);
    overflow-x:hidden;
  }

  /* ---------- steps container ---------- */
  .steps{
    height:100vh;
    overflow-y:scroll;
    scroll-snap-type:y mandatory;
  }
  .step{
    height:100vh;
    scroll-snap-align:start;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    padding:40px 32px;
    background:radial-gradient(120% 100% at 20% 0%, #58193F 0%, var(--navy-deep) 55%, #240A19 100%);
  }
  .step:nth-child(odd){
    background:radial-gradient(120% 100% at 80% 100%, #3D0F2C 0%, var(--navy-deep) 55%, #240A19 100%);
  }

  /* ---------- intro / text-only slide ---------- */
  .step-inner{
    max-width:820px;
    width:100%;
    color:#fff;
    text-align:center;
  }
  .eyebrow{
    display:inline-block;
    font-size:13px;
    font-weight:600;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--orange);
    margin-bottom:18px;
  }
  h1.step-title{
    font-size:clamp(30px,4vw,46px);
    font-weight:700;
    margin-bottom:22px;
    color:#fff;
  }
  .step-body{
    font-size:clamp(16px,1.8vw,20px);
    line-height:1.7;
    color:#EBD9E2;
    max-width:60ch;
    margin:0 auto;
  }
  .step-body + .step-body{ margin-top:14px; }

  /* ---------- image + text step layout ---------- */
  .step-inner--photo{
    max-width:1100px;
    width:100%;
    color:#fff;
    display:grid;
    grid-template-columns:minmax(220px, 380px) 1fr;
    align-items:center;
    gap:60px;
    text-align:left;
  }
  .step-number-row{
    display:flex;
    align-items:center;
    gap:18px;
    margin-bottom:14px;
  }
  .step-number{
    font-size:clamp(50px,6vw,80px);
    font-weight:800;
    color:var(--orange);
    line-height:1;
  }
  .step-word{
    font-size:clamp(24px,2.6vw,36px);
    font-weight:800;
    color:#fff;
    letter-spacing:.02em;
    line-height:1;
    white-space:nowrap; /* keeps long labels on one line */
  }
  .step-imgwrap{
    width:100%;
    aspect-ratio:1/1;
    border-radius:24px;
    overflow:hidden;
    border:3px solid rgba(255,255,255,.15);
    box-shadow:0 20px 50px rgba(0,0,0,.45);
    background:rgba(255,255,255,.06);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .step-imgwrap img{
    width:100%; height:100%; object-fit:cover; display:block;
  }
  .step-imgwrap .placeholder{
    color:rgba(255,255,255,.35);
    font-size:13px;
    letter-spacing:.08em;
    text-transform:uppercase;
  }
  .step-text{ max-width:56ch; }
  .step-inner--photo .step-title{
    font-size:clamp(22px,2.6vw,30px);
    font-weight:700;
    margin-bottom:18px;
    color:#fff;
  }
  .step-inner--photo .step-body{
    font-size:clamp(16px,1.6vw,19px);
    line-height:1.6;
    color:#EBD9E2;
    max-width:none;
    margin:0;
  }

  @media (max-width:820px){
    .step-inner--photo{
      grid-template-columns:1fr;
      text-align:center;
      gap:28px;
    }
    .step-imgwrap{
      max-width:280px;
      margin:0 auto;
    }
    .step-text{
      max-width:56ch;
      margin:0 auto;
    }
  }

  /* ---------- side nav dots ---------- */
  .dots{
    position:fixed;
    right:26px;
    top:50%;
    transform:translateY(-50%);
    display:flex;
    flex-direction:column;
    gap:14px;
    z-index:10;
  }
  .dot{
    width:11px; height:11px;
    border-radius:50%;
    background:rgba(255,255,255,.25);
    cursor:pointer;
    border:none;
    transition:background .2s;
  }
  .dot.active{background:var(--orange);}

  /* ---------- progress label ---------- */
  .progress-label{
    position:fixed;
    top:24px;
    left:32px;
    color:rgba(255,255,255,.55);
    font-size:13px;
    letter-spacing:.1em;
    text-transform:uppercase;
    font-weight:600;
    z-index:10;
  }

  @media (max-width:640px){
    .dots{right:14px;}
    .progress-label{left:16px; top:16px;}
  }
</style>
</head>
<body>

<!-- update "Step 1 / N" to match the real slide count -->
<div class="progress-label" id="progressLabel">Step 1 / 2</div>

<div class="dots" id="dots"></div>

<div class="steps" id="steps">

  <!-- ---------- SLIDE 1: intro (text-only) ---------- -->
  <section class="step" data-title="Intro">
    <div class="step-inner">
      <span class="eyebrow">Heart Creator</span>
      <h1 class="step-title">TRAINING TITLE</h1>
      <div class="step-body">Intro sentence explaining what this training walks through.</div>
    </div>
  </section>

  <!-- ---------- SLIDE 2: image + text step (copy this block per step) ---------- -->
  <section class="step" data-title="Step Name">
    <div class="step-inner--photo">
      <div class="step-imgwrap">
        <img src="images/Step 1.png" alt="Step Name" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
        <div class="placeholder" style="display:none;">Image: Step 1.png</div>
      </div>
      <div class="step-text">
        <div class="step-number-row">
          <div class="step-number">1</div>
          <div class="step-word">Word</div>
        </div>
        <div class="step-title">Step title / instruction</div>
        <div class="step-body">Step body copy.</div>
      </div>
    </div>
  </section>

</div>

<script>
  const stepsEl = document.getElementById('steps');
  const steps = document.querySelectorAll('.step');
  const dotsEl = document.getElementById('dots');
  const progressLabel = document.getElementById('progressLabel');

  steps.forEach((s, i) => {
    const dot = document.createElement('button');
    dot.className = 'dot' + (i === 0 ? ' active' : '');
    dot.addEventListener('click', () => steps[i].scrollIntoView({behavior:'smooth'}));
    dotsEl.appendChild(dot);
  });

  const dots = document.querySelectorAll('.dot');

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const idx = Array.from(steps).indexOf(entry.target);
        dots.forEach(d => d.classList.remove('active'));
        dots[idx].classList.add('active');
        progressLabel.textContent = `Step ${idx + 1} / ${steps.length}`;
      }
    });
  }, { root: stepsEl, threshold: 0.6 });

  steps.forEach(s => observer.observe(s));

  document.addEventListener('keydown', (e) => {
    const active = document.querySelector('.dot.active');
    const idx = Array.from(dots).indexOf(active);
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
      if (steps[idx + 1]) steps[idx + 1].scrollIntoView({behavior:'smooth'});
    } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
      if (steps[idx - 1]) steps[idx - 1].scrollIntoView({behavior:'smooth'});
    }
  });
</script>

</body>
</html>
